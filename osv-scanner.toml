# Advisories that Scorecard's osv-scanner reports for the module graph but that do not reach this
# code. Every entry names why. govulncheck is the reachability check.
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto is required indirectly for its cryptobyte and ssh/terminal packages, through github.com/misiektoja/go-tls-srp and github.com/globalsign/pemfile. Nothing imports the affected and unmaintained golang.org/x/crypto/openpgp packages. govulncheck reports no reachable vulnerable symbols and the advisory has no fixed version."
