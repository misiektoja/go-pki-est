site_name: go-pki-est
site_description: A Go library for Enrollment over Secure Transport (EST, RFC 7030) with a client, an embeddable server, TLS-SRP sign-in and post-quantum ML-DSA keys
site_url: https://misiektoja.github.io/go-pki-est/
repo_url: https://github.com/misiektoja/go-pki-est
repo_name: misiektoja/go-pki-est
copyright: Licensed under the MIT License

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# The pip requirements files live next to the pages for Dependabot but are not pages.
exclude_docs: |
  requirements.in
  requirements.txt

# The documentation build runs with --strict so every one of these findings fails the build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  # Go listings are included from example_test.go. go test compiles every example and runs those
  # with an Output comment, so the code on the pages cannot drift from the library.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      dedent_subsections: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Support matrix: support-matrix.md
  - Architecture: architecture.md
  - Client guide:
      - Enrollment and renewal: client/enrollment.md
      - Signing in: client/authentication.md
      - Connections and hooks: client/connections.md
      - TPM enrollment: client/tpm.md
  - Server guide:
      - Embedding the server: server/embedding.md
      - The CA interface: server/ca.md
      - Authentication: server/authentication.md
      - TLS-SRP: server/tls-srp.md
      - Refusals and limits: server/refusals-and-limits.md
  - Post-quantum algorithms: post-quantum.md
  - Command line tools:
      - estclient: tools/estclient.md
      - estserver: tools/estserver.md
  - Reference:
      - Client fields: reference/client.md
      - ServerConfig fields: reference/server-config.md
      - Errors: reference/errors.md
      - Compatibility policy: reference/compatibility.md
  - Interoperability: interoperability.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md
  - Security:
      - Security model: security/security-model.md
      - Verifying a release: security/verifying-releases.md
  - Development:
      - Development: development/development.md
      - Testing: development/testing.md
      - Release process: development/release-process.md
  - Known limitations: known-limitations.md
