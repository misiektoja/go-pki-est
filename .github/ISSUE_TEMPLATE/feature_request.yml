name: Feature request
description: Ask for a capability that go-pki-est does not have yet
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        The [features section](https://github.com/misiektoja/go-pki-est/blob/main/README.md#features) of the README lists the supported EST operations and the limits of the post-quantum algorithms.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The enrollment or integration problem, not the implementation you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would solve it
      description: The behavior, configuration field or interface you would like. Name the RFC section when the request is protocol level.
    validations:
      required: true

  - type: input
    id: peer
    attributes:
      label: EST peer this concerns
      placeholder: libest 3.2.0, an EST server product, other
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: What you do today instead, if anything.
    validations:
      required: false
